<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" lang="es">
<f:metadata><f:viewAction action="#{registroBean.cargarSesiones}" /></f:metadata>
<h:head>
    <title>Consultar sesiones</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <h:outputStylesheet library="css" name="p03.css" />
</h:head>
<h:body>
    <h1>Consultar sesiones</h1>
    <nav aria-label="Navegación principal">
        <p:tabMenu activeIndex="1" styleClass="p03-menu">
            <p:menuitem outcome="index" value="Inicio" icon="pi pi-home" />
            <p:menuitem outcome="sesiones" value="Sesiones" icon="pi pi-calendar" />
            <p:menuitem outcome="registro" value="Registrar asistencia" icon="pi pi-user-plus" />
            <p:menuitem outcome="registros" value="Registros" icon="pi pi-list" />
        </p:tabMenu>
    </nav>
    <h:form id="sesionesForm">
        <p:messages id="mensajes" showDetail="false" />
        <p:commandButton id="actualizar" value="Actualizar sesiones" icon="pi pi-refresh"
                         action="#{registroBean.cargarSesiones}" process="@this"
                         update="mensajes sesiones" partialSubmit="true" />
        <p:dataTable id="sesiones" value="#{registroBean.sesiones}" var="sesion"
                     emptyMessage="No existen sesiones registradas." paginator="true" rows="10"
                     paginatorAlwaysVisible="false" paginatorPosition="bottom" reflow="true"
                 rowsPerPageTemplate="5,10,20" paginatorTemplate="{PreviousPageLink} {PageLinks} {NextPageLink} {RowsPerPageDropdown}"
                 styleClass="p03-tabla">
            <p:column headerText="ID"><h:outputText value="#{sesion.idSesion}" /></p:column>
            <p:column headerText="Nombre"><h:outputText value="#{sesion.nombre}" /></p:column>
            <p:column headerText="Fecha"><h:outputText value="#{sesion.fecha}">
                <f:convertDateTime type="localDate" pattern="dd/MM/yyyy" />
            </h:outputText></p:column>
            <p:column headerText="Inicio"><h:outputText value="#{sesion.horaInicio}" /></p:column>
            <p:column headerText="Fin"><h:outputText value="#{sesion.horaFin}" /></p:column>
            <p:column headerText="Estado"><h:outputText value="#{sesion.estado}" /></p:column>
        </p:dataTable>
    </h:form>
</h:body>
</html>
