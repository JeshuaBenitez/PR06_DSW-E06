<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui" lang="es">
<f:metadata><f:viewAction action="#{registroBean.cargarRegistros}" /></f:metadata>
<h:head>
    <title>Consultar registros de asistencia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        nav a { display: inline-block; margin: 0 1rem 1rem 0; }
        .campo { margin-bottom: 1rem; }
        .campo label { display: block; margin-bottom: .4rem; }
        .campo .ui-selectonemenu, .campo textarea { max-width: 100%; }
        .ui-datatable { margin-top: 1rem; }
    </style>
</h:head>
<h:body>
    <h1>Consultar registros de asistencia</h1>
    <nav aria-label="Navegación principal">
        <h:link outcome="index" value="Inicio" />
        <h:link outcome="sesiones" value="Consultar sesiones" />
        <h:link outcome="registro" value="Registrar asistencia" />
        <h:link outcome="registros" value="Consultar registros" />
    </nav>
    <h:form id="consultaForm">
        <p:messages id="mensajes" showDetail="false" />
    <p:dataTable id="registros" value="#{registroBean.registros}" var="registro"
                 emptyMessage="No existen registros de asistencia." paginator="true" rows="10"
                 paginatorAlwaysVisible="false" reflow="true">
        <p:column headerText="ID"><h:outputText value="#{registro.idRegistro}" /></p:column>
        <p:column headerText="Sesión"><h:outputText value="#{registro.nombreSesion}" /></p:column>
        <p:column headerText="Participante"><h:outputText value="#{registro.nombreParticipante}" /></p:column>
        <p:column headerText="Tipo"><h:outputText value="#{registro.tipoRegistro}" /></p:column>
        <p:column headerText="Fecha y hora"><h:outputText value="#{registro.fechaHora}">
            <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm:ss" />
        </h:outputText></p:column>
        <p:column headerText="Observación"><h:outputText value="#{empty registro.observacion ? 'Sin observación' : registro.observacion}" /></p:column>
    </p:dataTable>
    </h:form>
</h:body>
</html>
