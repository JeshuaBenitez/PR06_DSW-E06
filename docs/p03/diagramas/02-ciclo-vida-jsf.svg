<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="1343.75px" preserveAspectRatio="none" style="width:1289px;height:1343px;background:#FFFFFF;" version="1.1" viewBox="0 0 1289 1343" width="1289.0625px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="Verdana" font-size="34.375" font-weight="bold" lengthAdjust="spacing" textLength="545.3125" x="369.5313" y="60.1845">PR06 P03 &#8212; Ciclo de vida JSF 2.3</text><text fill="#000000" font-family="Verdana" font-size="34.375" font-weight="bold" lengthAdjust="spacing" textLength="831.25" x="226.5625" y="107.0034">Env&#237;o AJAX de Registrar entrada (sin immediate)</text><ellipse cx="658.9844" cy="149.8878" fill="#FFFFFF" rx="15.625" ry="15.625" style="stroke:#000000;stroke-width:1.5625;"/><rect fill="#FFFFFF" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="390.625" x="463.6719" y="196.7628"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="132.8125" x="479.2969" y="232.4317">1. Restore View</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="359.375" x="479.2969" y="257.9694">Restaurar componentes y estado de vista</text><path d="M846.4844,302.1899 L846.4844,345.2509 L815.2344,351.5009 L846.4844,357.7509 L846.4844,400.8118 A0,0 0 0 0 846.4844,400.8118 L1208.9844,400.8118 A0,0 0 0 0 1208.9844,400.8118 L1208.9844,317.8149 L1193.3594,302.1899 L846.4844,302.1899 A0,0 0 0 0 846.4844,302.1899 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.5625;"/><path d="M1193.3594,302.1899 L1193.3594,317.8149 L1208.9844,317.8149 L1193.3594,302.1899 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.5625;"/><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="229.6875" x="855.8594" y="331.7165">process="@this campos"</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="192.1875" x="855.8594" y="359.3821">partialSubmit="true"</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="329.6875" x="855.8594" y="387.0478">Se procesan el bot&#243;n y sus campos.</text><rect fill="#FFFFFF" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="312.5" x="502.7344" y="310.3382"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="206.25" x="518.3594" y="346.0071">2. Apply Request Values</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="281.25" x="518.3594" y="371.5447">Decodificar los valores enviados</text><rect fill="#FFFFFF" height="107.863" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="385.9375" x="466.0156" y="432.0618"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="189.0625" x="481.6406" y="467.7307">3. Process Validations</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="354.6875" x="481.6406" y="493.2684">Conversi&#243;n de IDs, required, validadores</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="246.875" x="481.6406" y="518.8061">y m&#225;ximo de 200 caracteres</text><polygon fill="#FFFFFF" points="513.6719,571.1749,804.2969,571.1749,823.0469,589.9249,804.2969,608.6749,513.6719,608.6749,494.9219,589.9249,513.6719,571.1749" style="stroke:#000000;stroke-width:1.5625;"/><text fill="#000000" font-family="Verdana" font-size="17.1875" lengthAdjust="spacing" textLength="290.625" x="513.6719" y="596.5936">&#191;Conversi&#243;n y validaci&#243;n correctas?</text><text fill="#000000" font-family="Verdana" font-size="17.1875" lengthAdjust="spacing" textLength="12.5" x="482.4219" y="584.889">s&#237;</text><text fill="#000000" font-family="Verdana" font-size="17.1875" lengthAdjust="spacing" textLength="21.875" x="823.0469" y="584.889">no</text><rect fill="#FFFFFF" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="381.25" x="9.375" y="624.2999"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="206.25" x="25" y="659.9688">4. Update Model Values</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="350" x="25" y="685.5064">Actualizar propiedades de RegistroBean</text><path d="M390.625,747.7879 L390.625,832.3474 L359.375,838.5974 L390.625,844.8474 L390.625,929.4068 A0,0 0 0 0 390.625,929.4068 L925,929.4068 A0,0 0 0 0 925,929.4068 L925,763.4129 L909.375,747.7879 L390.625,747.7879 A0,0 0 0 0 390.625,747.7879 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.5625;"/><path d="M909.375,747.7879 L909.375,763.4129 L925,763.4129 L909.375,747.7879 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.5625;"/><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="470.3125" x="400" y="777.3145">Revalidar datos contra PostgreSQL mediante DAO.</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="303.125" x="400" y="804.9801">Rechazar duplicados sin insertar.</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="370.3125" x="400" y="832.6458">Si es v&#225;lido: insertar ENTRADA con JDBC,</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="435.9375" x="400" y="860.3114">agregar mensaje de &#233;xito y consultar registros.</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="390.625" x="400" y="887.9771">Si falla: mostrar un mensaje comprensible.</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="501.5625" x="400" y="915.6427">UNIQUE protege tambi&#233;n de inserciones simult&#225;neas.</text><rect fill="#FFFFFF" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="318.75" x="40.625" y="797.4347"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="179.6875" x="56.25" y="833.1036">5. Invoke Application</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="287.5" x="56.25" y="858.6412">Ejecutar RegistroBean.registrar()</text><rect fill="#FFE4E1" height="107.863" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="323.4375" x="956.25" y="624.2999"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="285.9375" x="971.875" y="659.9688">Guardar mensajes de validaci&#243;n;</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="181.25" x="971.875" y="685.5064">saltar las fases 4 y 5;</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="292.1875" x="971.875" y="711.0441">NO ejecutar registrar() ni insertar</text><polygon fill="#FFFFFF" points="658.9844,938.7818,677.7344,957.5318,658.9844,976.2818,640.2344,957.5318,658.9844,938.7818" style="stroke:#000000;stroke-width:1.5625;"/><path d="M829.2969,991.9068 L829.2969,1048.8006 L798.0469,1055.0506 L829.2969,1061.3006 L829.2969,1118.1944 A0,0 0 0 0 829.2969,1118.1944 L1235.5469,1118.1944 A0,0 0 0 0 1235.5469,1118.1944 L1235.5469,1007.5318 L1219.9219,991.9068 L829.2969,991.9068 A0,0 0 0 0 829.2969,991.9068 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.5625;"/><path d="M1219.9219,991.9068 L1219.9219,1007.5318 L1235.5469,1007.5318 L1219.9219,991.9068 " fill="#FFFFFF" style="stroke:#000000;stroke-width:1.5625;"/><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="268.75" x="838.6719" y="1021.4334">update="mensajes registros"</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="371.875" x="838.6719" y="1049.099">JSF devuelve una respuesta parcial XML.</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="373.4375" x="838.6719" y="1076.7647">PrimeFaces actualiza esos componentes</text><text fill="#000000" font-family="Verdana" font-size="20.3125" lengthAdjust="spacing" textLength="342.1875" x="838.6719" y="1104.4303">sin recargar el documento completo.</text><rect fill="#FFFFFF" height="82.3254" rx="19.5313" ry="19.5313" style="stroke:#000000;stroke-width:1.5625;" width="278.125" x="519.9219" y="1013.8879"/><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="171.875" x="535.5469" y="1049.5568">6. Render Response</text><text fill="#000000" font-family="Verdana" font-size="18.75" lengthAdjust="spacing" textLength="246.875" x="535.5469" y="1075.0945">Renderizar mensajes y tabla</text><ellipse cx="658.9844" cy="1166.6319" fill="none" rx="17.1875" ry="17.1875" style="stroke:#000000;stroke-width:1.5625;"/><ellipse cx="658.9844" cy="1166.6319" fill="#FFFFFF" rx="9.375" ry="9.375" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="658.9844" x2="658.9844" y1="165.5128" y2="196.7628"/><polygon fill="#000000" points="652.7344,181.1378,658.9844,196.7628,665.2344,181.1378,658.9844,187.3878" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="658.9844" x2="658.9844" y1="279.0882" y2="310.3382"/><polygon fill="#000000" points="652.7344,294.7132,658.9844,310.3382,665.2344,294.7132,658.9844,300.9632" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="658.9844" x2="658.9844" y1="392.6635" y2="432.0618"/><polygon fill="#000000" points="652.7344,416.4368,658.9844,432.0618,665.2344,416.4368,658.9844,422.6868" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="200" x2="200" y1="706.6252" y2="797.4347"/><polygon fill="#000000" points="193.75,781.8097,200,797.4347,206.25,781.8097,200,788.0597" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="494.9219" x2="200" y1="589.9249" y2="589.9249"/><line style="stroke:#000000;stroke-width:1.5625;" x1="200" x2="200" y1="589.9249" y2="624.2999"/><polygon fill="#000000" points="193.75,608.6749,200,624.2999,206.25,608.6749,200,614.9249" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="823.0469" x2="1117.9688" y1="589.9249" y2="589.9249"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1117.9688" x2="1117.9688" y1="589.9249" y2="624.2999"/><polygon fill="#000000" points="1111.7188,608.6749,1117.9688,624.2999,1124.2188,608.6749,1117.9688,614.9249" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="200" x2="200" y1="879.76" y2="957.5318"/><line style="stroke:#000000;stroke-width:1.5625;" x1="200" x2="640.2344" y1="957.5318" y2="957.5318"/><polygon fill="#000000" points="624.6094,951.2818,640.2344,957.5318,624.6094,963.7818,630.8594,957.5318" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1117.9688" x2="1117.9688" y1="732.1629" y2="957.5318"/><line style="stroke:#000000;stroke-width:1.5625;" x1="1117.9688" x2="677.7344" y1="957.5318" y2="957.5318"/><polygon fill="#000000" points="693.3594,951.2818,677.7344,957.5318,693.3594,963.7818,687.1094,957.5318" style="stroke:#000000;stroke-width:1.5625;"/><line style="stroke:#000000;stroke-width:1.5625;" x1="658.9844" x2="658.9844" y1="539.9249" y2="571.1749"/><polygon fill="#000000" points="652.7344,555.5499,658.9844,571.1749,665.2344,555.549